# All trips — the single source of truth. Read by the travel agent, tools/remind.py
# (time zone + 9 pm briefing follow `tz` while you're away) and tools/adele_check.py (skips away days).
#
# id:          short unique id, e.g. sg-2027-03
# name:        human name
# type:        personal | work
# status:      idea | planning | booked | done
# start / end: YYYY-MM-DD (first and last day away from Hong Kong)
# tz:          IANA time zone at the destination (e.g. Asia/Tokyo, Asia/Singapore, Asia/Taipei)
# countries:   ISO codes
# travellers:  [Miranda, Stanley]
# activities:  optional — hiking | beach | snowboarding | climbing … (picks extra packing sections)
# folder:      Trips/<folder name>
# entry_check: date the visa / entry-requirement check was last done (YYYY-MM-DD), or null
# stays:       optional list of {name, from, to, ref}
# places:      optional list of {name, region, from, to}: towns for the 9 am pre-trip weather DM
#              (sent the day before `start`). Without it the trip `name` is used, so give
#              multi-city trips or ambiguous towns (region = prefecture/state) a places list.

- id: singapore-2026-11
  name: Singapore
  type: work
  status: booked
  start: 2026-11-16
  end: 2026-11-18
  tz: Asia/Singapore
  countries: [SG]
  travellers: [Miranda]
  folder: null
  entry_check: null
  flights:
    - {flight: CX 791, date: 2026-11-16, route: HKG-SIN, dep: "12:50", arr: "16:50", ref: 5C5ASC}
    - {flight: CX 734, date: 2026-11-18, route: SIN-HKG, dep: "16:45", arr: "20:40", ref: 5C5ASC}
  stays:
    - {name: Grand Park City Hall, from: 2026-11-16, to: 2026-11-18}

